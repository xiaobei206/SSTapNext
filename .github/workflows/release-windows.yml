name: Build and publish Windows installer

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build SSTap Next installer (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify release tag matches project version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' does not match package.json version '$version' (expected '$expectedTag')."
          }
          Write-Host "Release tag/version match: $expectedTag"

      - name: Build, test and package on Windows
        shell: pwsh
        run: .\scripts\Build-Windows.ps1

      - name: Verify installer and create SHA-256 file
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $installer = Join-Path $PWD "release\SSTap Next-$version-x64.exe"
          $blockmap = "$installer.blockmap"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer missing: $installer" }
          if (-not (Test-Path -LiteralPath $blockmap -PathType Leaf)) { throw "Blockmap missing: $blockmap" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashFile = "$installer.sha256"
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath $hashFile -Encoding ASCII
          Write-Host "Installer: $installer"
          Write-Host "Size: $((Get-Item -LiteralPath $installer).Length) bytes"
          Write-Host "SHA-256: $hash"

      - name: Upload installer assets to the published GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $installer = Join-Path $PWD "release\SSTap Next-$version-x64.exe"
          $blockmap = "$installer.blockmap"
          $hashFile = "$installer.sha256"
          gh release upload $env:RELEASE_TAG $installer $blockmap $hashFile --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets with GitHub CLI.' }
