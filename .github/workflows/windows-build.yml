name: Build and publish SSTap Next Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sstapnext-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, verify and publish SSTap Next (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate release version and tag
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'package.json version is empty.' }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $expectedTag = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag/version mismatch: tag=$env:GITHUB_REF_NAME, expected=$expectedTag."
            }
          }
          $notes = "docs/RELEASE-$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes not found: $notes"
          }
          Write-Host "Validated SSTap Next $version"

      - name: Check whether this version already has a GitHub Release
        id: release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $tag = "v$version"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --json tagName 1>$null 2>$null
          $releaseLookupExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($releaseLookupExit -eq 0) {
            "needs_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $tag already exists; build and publish are skipped."
          } elseif ($releaseLookupExit -eq 1) {
            "needs_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $tag does not exist; this verified build will create it."
          } else {
            throw "GitHub release lookup failed with exit code $releaseLookupExit."
          }

      - name: Verify package lock
        if: steps.release.outputs.needs_release == 'true'
        run: node scripts/verify-package-lock.mjs

      - name: Build, test and package Windows installer
        if: steps.release.outputs.needs_release == 'true'
        shell: pwsh
        run: .\\scripts\\Build-Windows.ps1 -SkipInstall

      - name: Verify installer and create SHA-256 file
        if: steps.release.outputs.needs_release == 'true'
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $installer = Join-Path $PWD "release\\SSTap Next-$version-x64.exe"
          $blockmap = "$installer.blockmap"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer missing: $installer" }
          if (-not (Test-Path -LiteralPath $blockmap -PathType Leaf)) { throw "Blockmap missing: $blockmap" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashFile = "$installer.sha256"
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath $hashFile -Encoding ASCII
          Write-Host "Installer: $installer"
          Write-Host "Size: $((Get-Item -LiteralPath $installer).Length) bytes"
          Write-Host "SHA-256: $hash"

      - name: Publish GitHub Release
        if: steps.release.outputs.needs_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $installer = Join-Path $PWD "release\\SSTap Next-$version-x64.exe"
          $blockmap = "$installer.blockmap"
          $hashFile = "$installer.sha256"
          $notes = Join-Path $PWD "docs\\RELEASE-$version.md"
          $tag = "v$version"
          gh release create $tag $installer $blockmap $hashFile --target $env:GITHUB_SHA --title "SSTap Next $version" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag." }

      - name: Upload installer as workflow artifact
        if: steps.release.outputs.needs_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SSTapNext-${{ github.ref_name }}-Windows-x64
          path: |
            release/SSTap Next-*-x64.exe
            release/SSTap Next-*-x64.exe.blockmap
            release/SSTap Next-*-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30
